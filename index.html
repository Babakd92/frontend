<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000; --line:#D7DEE8; --panel:#FFFFFF; --surface:#F3F7FB;
    --brand:#1F4E79; --brand-dark:#173D5F; --brand-light:rgba(31,78,121,0.08); --brand-2:#2D7A78;
    --error:#A31621; --error-light:#FCEBEB;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Roboto',sans-serif;color:var(--ink);background:var(--surface);
    display:flex;flex-direction:column;
  }
  header{
    background:var(--brand);color:#fff;padding:16px 24px;box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-0.01em;}
  header p{margin:4px 0 0;font-size:13px;opacity:.9;}
  .wrap{flex:1;display:flex;flex-direction:column;max-width:820px;margin:0 auto;width:100%;padding:0 16px;min-height:0;}
  #log{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:16px;}
  .msg{max-width:88%;}
  .msg.user{align-self:flex-end;}
  .msg.assistant{align-self:flex-start;}
  .bubble{padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;}
  .msg.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:2px;}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:2px;}
  .msg.assistant .bubble.error{background:var(--error-light);border-color:rgba(163,22,33,.3);color:var(--error);}
  .meta{font-size:12px;color:#556;margin-top:6px;padding-left:2px;}
  .meta b{color:var(--brand-dark);}
  .table-wrap{margin-top:10px;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:var(--brand);color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;}
  tbody tr:nth-child(even) td{background:#EBF3FB;}
  .chart-box{margin-top:10px;height:240px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;}
  .typing{display:flex;gap:5px;padding:6px 2px;}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:.4;animation:blink 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:.9;}}
  form{display:flex;gap:10px;padding:14px 0 18px;border-top:1px solid var(--line);}
  input[type=text]{
    flex:1;font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #B7C4D4;border-radius:8px;
  }
  input[type=text]:focus{outline:3px solid var(--brand-light);border-color:var(--brand-2);}
  button{
    font-family:inherit;font-size:15px;font-weight:700;padding:12px 22px;border-radius:8px;border:none;
    background:var(--brand);color:#fff;cursor:pointer;
  }
  button:hover{background:var(--brand-dark);}
  button:disabled{opacity:.5;cursor:default;}
  .suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 0;}
  .suggestions button{background:#fff;color:var(--brand);border:1px solid var(--line);font-weight:500;font-size:13.5px;padding:8px 14px;}
  .suggestions button:hover{background:var(--brand-light);}
</style>
</head>
<body>
<header>
  <h1>HydroX</h1>
  <p>Ask a hydrology or climate question. Every answer is sourced from a named public dataset — never a guess.</p>
</header>

<div class="wrap">
  <div id="log"></div>
  <div class="suggestions" id="suggestions">
    <button type="button">What is the annual precipitation in Kentucky from 2010 to 2020?</button>
    <button type="button">What is the weather forecast for Denver, Colorado this week?</button>
    <button type="button">What is the annual land evapotranspiration in Fresno, California for 2023?</button>
    <button type="button">What was the streamflow near Columbus, Ohio last month?</button>
  </div>
  <form id="chat-form">
    <input type="text" id="input" placeholder="Ask a hydrology or climate question..." autocomplete="off">
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
  // Fill in your deployed Render backend URL after deployment, e.g.
  // "https://hydrox-backend.onrender.com"
  const BACKEND_URL = "https://backend-h9uu.onrender.com";

  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const suggestions = document.getElementById('suggestions');
  let history = [];
  let chartCounter = 0;

  suggestions.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      input.value = e.target.textContent;
      suggestions.style.display = 'none';
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    suggestions.style.display = 'none';
    addUserMessage(message);
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    const typingEl = addTypingIndicator();

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history }),
      });
      typingEl.remove();
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        addAssistantMessage({ reply: errBody.detail || `Request failed (HTTP ${res.status}).` }, true);
        return;
      }
      const data = await res.json();
      addAssistantMessage(data, false);
      history.push({ role: 'user', content: message });
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      typingEl.remove();
      addAssistantMessage({ reply: `Could not reach HydroX's backend: ${err.message}. If BACKEND_URL is still the placeholder, this page hasn't been configured yet.` }, true);
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addAssistantMessage(data, isError) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    bubble.textContent = data.reply || '(no response)';
    div.appendChild(bubble);

    if (!isError && data.source) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `Source: <b>${escapeHtml(data.source.name)}</b> (${escapeHtml(data.source.agency)})`
        + (data.limitations ? `<br>${escapeHtml(data.limitations)}` : '');
      div.appendChild(meta);
    }

    if (!isError && data.table && data.table.columns && data.table.rows.length) {
      div.appendChild(renderTable(data.table));
    }
    if (!isError && data.chart) {
      div.appendChild(renderChart(data.chart));
    }

    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function renderTable(table) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const t = document.createElement('table');
    const thead = document.createElement('tr');
    table.columns.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      thead.appendChild(th);
    });
    t.appendChild(thead);
    table.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(v => {
        const td = document.createElement('td');
        td.textContent = v === null || v === undefined ? '—' : v;
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    return wrap;
  }

  function renderChart(chart) {
    const box = document.createElement('div');
    box.className = 'chart-box';
    const canvas = document.createElement('canvas');
    canvas.id = `chart-${chartCounter++}`;
    box.appendChild(canvas);
    // Chart.js needs the canvas attached to the DOM before it can size itself.
    requestAnimationFrame(() => {
      new Chart(canvas, {
        type: 'line',
        data: {
          labels: chart.labels,
          datasets: [{
            label: chart.y_label,
            data: chart.values,
            borderColor: '#1F4E79',
            backgroundColor: 'rgba(31,78,121,0.08)',
            fill: true,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { x: { title: { display: true, text: chart.x_label } }, y: { title: { display: true, text: chart.y_label } } },
        },
      });
    });
    return box;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>
</body>
</html>
