<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydroinformatics Intelligence Platform (HIP)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0FB5A6; --teal-dark:#0B8577; --indigo:#3E2E7A;
    --coral:#FF6B7A; --coral-2:#FF9A5A;
    --glass:rgba(18,12,30,0.34); --glass-strong:rgba(255,255,255,0.26);
    --glass-border:rgba(255,255,255,0.28); --ink:#1A1226;
    --shadow:0 24px 70px rgba(15,5,25,0.45);
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    height:100vh;height:100dvh;margin:0;
    font-family:'Inter',sans-serif;color:#fff;
    background:url('background_3.jpg') center center / cover no-repeat fixed, #5B7FE0;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:linear-gradient(180deg, rgba(20,10,35,.38), rgba(20,10,20,.22) 45%, rgba(10,10,10,.42));
    pointer-events:none;z-index:0;
  }
  .shell{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;
    max-width:900px;margin:0 auto;width:100%;padding:26px 20px 20px;}

  header{display:flex;align-items:baseline;justify-content:center;text-align:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  header h1{
    margin:0;font-family:'Sora',sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.02em;
    background:linear-gradient(90deg,#fff, #FFE3C2);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin:0;font-size:13.5px;color:rgba(255,255,255,0.82);font-weight:500;}

  .card{
    flex:1;display:flex;flex-direction:column;min-height:0;
    background:var(--glass);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--glass-border);border-radius:26px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    overflow:hidden;
  }

  #log{flex:1;overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:18px;}
  #log::-webkit-scrollbar{width:8px;}
  #log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:8px;}

  .msg{max-width:86%;display:flex;flex-direction:column;}
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.assistant{align-self:flex-start;align-items:flex-start;max-width:100%;width:100%;}

  .bubble{padding:14px 18px;border-radius:18px;font-size:15px;line-height:1.55;white-space:pre-wrap;}
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--teal),var(--indigo));color:#fff;
    border-bottom-right-radius:4px;box-shadow:0 8px 24px rgba(15,181,166,0.35);
  }
  .msg.assistant .bubble{
    background:rgba(255,255,255,0.9);color:var(--ink);border:1px solid rgba(255,255,255,0.6);
    border-bottom-left-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.12);
  }
  .msg.assistant .bubble.error{background:rgba(255,235,235,0.95);color:#8C1230;border-color:rgba(140,18,48,.25);}

  .meta{font-size:12px;color:rgba(255,255,255,0.85);margin-top:8px;padding:0 4px;max-width:92%;}
  .meta b{color:#FFE3C2;}

  .table-wrap{margin-top:10px;overflow-x:auto;border-radius:14px;background:rgba(255,255,255,0.94);
    box-shadow:0 8px 24px rgba(0,0,0,0.12);max-width:100%;align-self:stretch;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;color:var(--ink);}
  th,td{padding:9px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid rgba(0,0,0,0.06);}
  th{background:#E7E9EE;color:#4A4E5A;font-weight:700;font-size:11.5px;
     text-transform:uppercase;letter-spacing:.04em;}
  tbody tr:nth-child(even) td{background:rgba(15,181,166,0.06);}

  .chart-box{margin-top:10px;height:280px;background:rgba(255,255,255,0.94);border-radius:14px;padding:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);align-self:stretch;}

  .chart-grid{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-self:stretch;}
  .chart-grid .chart-box{margin-top:0;height:260px;}
  @media (max-width:700px){ .chart-grid{grid-template-columns:1fr;} }

  .plotly-box{margin-top:10px;background:rgba(255,255,255,0.94);border-radius:14px;padding:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);align-self:stretch;overflow-x:auto;}

  .map-box{margin-top:10px;background:rgba(255,255,255,0.94);border-radius:14px;padding:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);align-self:stretch;}
  .map-box .leaflet-container{height:240px;border-radius:10px;}
  .map-caption{display:flex;gap:16px;flex-wrap:wrap;padding:8px 4px 2px;font-size:12.5px;color:rgba(26,18,38,0.7);}
  .map-caption .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
  .map-pin{font-size:22px;line-height:22px;text-align:center;text-shadow:0 0 3px rgba(0,0,0,0.5);}
  .map-pin-query{color:var(--teal);}
  .map-pin-station{color:var(--coral-2);}

  .typing{display:flex;gap:5px;padding:4px 2px;}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--teal);opacity:.4;animation:blink 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:.95;}}

  .suggestions{display:flex;flex-wrap:wrap;gap:9px;padding:14px 22px 0;}
  .suggestions button{
    font-family:'Inter',sans-serif;background:rgba(255,255,255,0.14);color:#fff;border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;font-weight:500;font-size:13px;padding:9px 16px;cursor:pointer;transition:.15s ease;
    backdrop-filter:blur(6px);
  }
  .suggestions button:hover{background:rgba(255,255,255,0.28);transform:translateY(-1px);}

  form{display:flex;gap:10px;padding:18px 22px 22px;}
  input[type=text]{
    flex:1;font-family:'Inter',sans-serif;font-size:15px;padding:14px 18px;border-radius:14px;
    border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.16);color:#fff;
    backdrop-filter:blur(6px);
  }
  input[type=text]::placeholder{color:rgba(255,255,255,0.65);}
  input[type=text]:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,107,122,0.25);}
  button[type=submit]{
    font-family:'Sora',sans-serif;font-size:15px;font-weight:700;padding:14px 26px;border-radius:14px;border:none;
    background:linear-gradient(120deg,var(--coral),var(--coral-2));color:#fff;cursor:pointer;
    box-shadow:0 10px 26px rgba(255,107,122,0.4);transition:transform .12s ease;
  }
  button[type=submit]:hover{transform:translateY(-1px);}
  button[type=submit]:disabled{opacity:.5;cursor:default;transform:none;}
  input[type=text]:disabled{opacity:.6;}


  @media (max-width:600px){
    header h1{font-size:27px;}
    .shell{padding:16px 12px 12px;}
    #log{padding:18px;}
    form{padding:14px;}
    .suggestions{padding:12px 14px 0;}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Hydroinformatics Intelligence Platform (HIP)</h1>
  </header>

  <div class="card">
    <div id="log"></div>
    <div class="suggestions" id="suggestions">
      <button type="button">What is the annual precipitation in Kentucky from 2010 to 2020?</button>
      <button type="button">Give me 7-day historical and 14-day forecast precipitation and temperature for Columbus, Ohio</button>
      <button type="button">What is the annual land evapotranspiration in Fresno, California for 2023?</button>
      <button type="button">What was the streamflow near Columbus, Ohio last month?</button>
      <button type="button">What is the climate outlook for Phoenix, Arizona?</button>
      <button type="button">Give me the 7-day historical and 14-day forecast soil moisture at 40.7434, -84.0246</button>
      <button type="button">What is the river water level near Columbus, Ohio for the last 30 days?</button>
      <button type="button">What is the groundwater level near Wichita, Kansas over the past 5 years?</button>
      <button type="button">Is Fresno, California currently in drought?</button>
      <button type="button">What watershed is Columbus, Ohio in?</button>
      <button type="button">What is the streamflow for HUC 05060001?</button>
      <button type="button">What is the watershed-averaged evapotranspiration for HUC 05060001 in 2023?</button>
      <button type="button">What is the NDVI for HUC 05060001 in 2023?</button>
      <button type="button">Show me the NDVI heatmap for HUC 05060001 in August 2023</button>
      <button type="button">What is the predicted water level in the Huron River over the next few days?</button>
    </div>
    <form id="chat-form">
      <input type="text" id="input" placeholder="Ask a hydrology or climate question..." autocomplete="off">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
</div>
<script>
  // Fill in your deployed Render backend URL after deployment, e.g.
  // "https://hydrox-backend.onrender.com"
  const BACKEND_URL = "https://backend-h9uu.onrender.com";

  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const suggestions = document.getElementById('suggestions');
  let history = [];
  let chartCounter = 0;

  // History/forecast weather charts: dark-red-dashed = history, blue-solid = forecast --
  // matches the reference dashboard's convention exactly.
  const HIST_COLOR = '#A32D2D';
  const FCST_COLOR = '#185FA5';

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  // Parsed manually (not `new Date(iso)`) to avoid a UTC-shift off-by-one day.
  function longDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return `${MONTH_NAMES[m - 1]} ${d}, ${y}`;
  }
  function shortDate(iso) {
    const [, m, d] = iso.split('-').map(Number);
    return `${MONTH_NAMES[m - 1]} ${d}`;
  }

  // Splits a daily array into history/forecast portions sharing the boundary index,
  // so the two line segments (or adjacent bars) visually touch instead of gapping.
  function splitHistForecast(arr, historyDays) {
    return {
      hist: arr.map((v, i) => (i <= historyDays ? v : null)),
      fcst: arr.map((v, i) => (i >= historyDays ? v : null)),
    };
  }

  function histForecastBgPlugin(boundary) {
    return {
      id: 'histForecastBg',
      beforeDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea || !scales.x) return;
        const boundaryX = scales.x.getPixelForValue(boundary);
        ctx.save();
        ctx.fillStyle = 'rgba(163,45,45,0.08)';
        ctx.fillRect(chartArea.left, chartArea.top, boundaryX - chartArea.left, chartArea.bottom - chartArea.top);
        ctx.fillStyle = 'rgba(24,95,165,0.08)';
        ctx.fillRect(boundaryX, chartArea.top, chartArea.right - boundaryX, chartArea.bottom - chartArea.top);
        ctx.restore();
      },
    };
  }

  // Splits a series at a boundary key (e.g. the current year among a list of year
  // strings) sharing the boundary point, same touching-segments convention as above.
  function splitAtBoundary(values, keys, boundaryKey) {
    let boundary = keys.findIndex(k => k >= boundaryKey);
    if (boundary === -1) boundary = keys.length - 1;
    return {
      hist: values.map((v, i) => (i <= boundary ? v : null)),
      fcst: values.map((v, i) => (i >= boundary ? v : null)),
    };
  }

  // Shared legend config for the climate-outlook charts: renders each item using its
  // dataset's own pointStyle instead of a plain box, and drops the invisible
  // min-boundary lines that only exist to anchor a shaded range's fill.
  const POINT_STYLE_LEGEND = {
    labels: {
      color: '#1A1226',
      usePointStyle: true,
      filter: (item, data) => !data.datasets[item.datasetIndex].hideFromLegend,
    },
  };

  suggestions.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      input.value = e.target.textContent;
      suggestions.style.display = 'none';
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    suggestions.style.display = 'none';
    addUserMessage(message);
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    const typingEl = addTypingIndicator();

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history }),
      });
      typingEl.remove();
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        addAssistantMessage({ reply: errBody.detail || `Request failed (HTTP ${res.status}).` }, true);
        return;
      }
      const data = await res.json();
      addAssistantMessage(data, false);
      history.push({ role: 'user', content: message });
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      typingEl.remove();
      addAssistantMessage({ reply: `Could not reach HIP's backend: ${err.message}. If BACKEND_URL is still the placeholder, this page hasn't been configured yet.` }, true);
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addAssistantMessage(data, isError) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    bubble.textContent = data.reply || '(no response)';
    div.appendChild(bubble);

    if (!isError && data.source) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `Source: <b>${escapeHtml(data.source.name)}</b> (${escapeHtml(data.source.agency)})`
        + (data.limitations ? `<br>${escapeHtml(data.limitations)}` : '');
      div.appendChild(meta);
    }

    if (!isError && data.table && data.table.columns && data.table.rows.length) {
      div.appendChild(renderTable(data.table));
    }
    if (!isError && data.charts && data.charts.length) {
      if (data.chart_layout === 'grid') {
        const grid = document.createElement('div');
        grid.className = 'chart-grid';
        data.charts.forEach(c => grid.appendChild(renderChart(c)));
        div.appendChild(grid);
      } else {
        data.charts.forEach(c => div.appendChild(renderChart(c)));
      }
    }
    if (!isError && data.plotly) {
      div.appendChild(renderPlotlyChart(data.plotly));
    }
    if (!isError && data.location) {
      div.appendChild(renderMap(data.location));
    }

    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function renderTable(table) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const t = document.createElement('table');
    const thead = document.createElement('tr');
    table.columns.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      thead.appendChild(th);
    });
    t.appendChild(thead);
    table.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(v => {
        const td = document.createElement('td');
        if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
          td.textContent = longDate(v);
        } else {
          td.textContent = v === null || v === undefined ? '—' : v;
        }
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    return wrap;
  }

  // Renders a Plotly chart's data/layout exactly as extracted from the source dashboard
  // (flood_forecast) -- reproducing that dashboard's own chart verbatim rather than
  // reimplementing its dual-axis/multi-scenario/flood-stage-band design in Chart.js.
  function renderPlotlyChart(plotly) {
    const box = document.createElement('div');
    box.className = 'plotly-box';
    const div = document.createElement('div');
    div.id = `plotly-${chartCounter++}`;
    box.appendChild(div);
    requestAnimationFrame(() => {
      Plotly.newPlot(div, plotly.data, plotly.layout, { responsive: true, displaylogo: false });
    });
    return box;
  }

  // Shows where the answer actually came from: a pin for the resolved query point, and
  // -- for station-based tools like streamflow/groundwater_level, where the nearest
  // gauge/well can be miles from the query point -- a second pin for the station
  // actually used, connected by a dashed line with the distance between them.
  function renderMap(location) {
    const box = document.createElement('div');
    box.className = 'map-box';
    const mapDiv = document.createElement('div');
    mapDiv.id = `map-${chartCounter++}`;
    box.appendChild(mapDiv);
    const caption = document.createElement('div');
    caption.className = 'map-caption';
    box.appendChild(caption);
    requestAnimationFrame(() => drawMap(mapDiv, caption, location));
    return box;
  }

  function drawMap(mapDiv, caption, location) {
    const map = L.map(mapDiv.id, { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18,
    }).addTo(map);

    const queryIcon = L.divIcon({ className: 'map-pin map-pin-query', html: '●', iconSize: [22, 22] });
    const stationIcon = L.divIcon({ className: 'map-pin map-pin-station', html: '●', iconSize: [22, 22] });

    const queryLatLng = [location.query.latitude, location.query.longitude];
    const queryLabel = [location.query.name, location.query.admin1, location.query.country].filter(Boolean).join(', ');
    L.marker(queryLatLng, { icon: queryIcon }).addTo(map).bindTooltip(queryLabel || 'Query location');
    caption.innerHTML = `<span><span class="dot" style="background:var(--teal)"></span>${escapeHtml(queryLabel || 'Query location')}</span>`;

    const bounds = L.latLngBounds([queryLatLng]);
    let hasExtent = false;

    if (location.heatmap) {
      const overlay = L.imageOverlay(location.heatmap.url, location.heatmap.bounds, { opacity: 0.85 }).addTo(map);
      bounds.extend(overlay.getBounds());
      hasExtent = true;
      caption.innerHTML += `<span><span class="dot" style="background:linear-gradient(90deg,#a50026,#1a9850)"></span>${escapeHtml(location.heatmap.label || 'NDVI heatmap')} (brown = sparse, green = dense)</span>`;
    }

    if (location.boundary) {
      // Drawn after the heatmap (if any) so the outline stroke stays visible on top of
      // the raster instead of being covered by it.
      const polygon = L.polygon(location.boundary, {
        color: '#0FB5A6', weight: 2, fillColor: '#0FB5A6', fillOpacity: location.heatmap ? 0 : 0.1,
      }).addTo(map);
      bounds.extend(polygon.getBounds());
      hasExtent = true;
      caption.innerHTML += `<span><span class="dot" style="background:var(--teal);opacity:0.35"></span>Watershed boundary</span>`;
    }

    if (location.station) {
      const stationLatLng = [location.station.latitude, location.station.longitude];
      L.marker(stationLatLng, { icon: stationIcon }).addTo(map)
        .bindTooltip(location.station.name || 'Station used');
      L.polyline([queryLatLng, stationLatLng], { color: '#FF9A5A', weight: 2, dashArray: '5,5' }).addTo(map);
      bounds.extend(stationLatLng);
      hasExtent = true;
      const distKm = (map.distance(queryLatLng, stationLatLng) / 1000).toFixed(1);
      caption.innerHTML += `<span><span class="dot" style="background:var(--coral-2)"></span>${escapeHtml(location.station.name || 'Station used')} (${distKm} km away)</span>`;
    }

    if (hasExtent) {
      map.fitBounds(bounds, { padding: [30, 30] });
    } else {
      map.setView(queryLatLng, 10);
    }
  }

  function renderChart(chart) {
    const box = document.createElement('div');
    box.className = 'chart-box';
    const canvas = document.createElement('canvas');
    canvas.id = `chart-${chartCounter++}`;
    box.appendChild(canvas);
    // Chart.js needs the canvas attached to the DOM before it can size itself.
    requestAnimationFrame(() => {
      if (chart.type === 'weather_precip') drawWeatherPrecipChart(canvas, chart);
      else if (chart.type === 'weather_temp') drawWeatherTempChart(canvas, chart);
      else if (chart.type === 'soil_moisture') drawSoilMoistureChart(canvas, chart);
      else if (chart.type === 'climate_annual_temp' || chart.type === 'climate_annual_precip') drawClimateAnnualChart(canvas, chart);
      else if (chart.type === 'climatology_temp' || chart.type === 'climatology_precip') drawClimatologyChart(canvas, chart);
      else if (chart.type === 'streamflow_discharge') drawStreamflowDischargeChart(canvas, chart);
      else if (chart.type === 'river_level_temp') drawRiverLevelTempChart(canvas, chart);
      else drawGenericLineChart(canvas, chart);
    });
    return box;
  }

  function drawGenericLineChart(canvas, chart) {
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: chart.labels,
        datasets: [{
          label: chart.y_label,
          data: chart.values,
          borderColor: '#0FB5A6',
          backgroundColor: 'rgba(15,181,166,0.12)',
          fill: true,
          tension: 0.3,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#1A1226' } } },
        scales: {
          x: { title: { display: true, text: chart.x_label, color: '#1A1226' }, ticks:{color:'#1A1226'} },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks:{color:'#1A1226'} },
        },
      },
    });
  }

  // Precipitation: history (dark red bars) + forecast (blue bars), same split boundary
  // as the temperature chart below -- matches the reference dashboard's convention.
  function drawWeatherPrecipChart(canvas, chart) {
    const { hist, fcst } = splitHistForecast(chart.values, chart.history_days);
    new Chart(canvas, {
      type: 'bar',
      data: {
        labels: chart.labels.map(shortDate),
        datasets: [
          { label: 'History (mm)', data: hist, backgroundColor: HIST_COLOR },
          { label: 'Forecast (mm)', data: fcst, backgroundColor: FCST_COLOR },
        ],
      },
      plugins: [histForecastBgPlugin(chart.history_days)],
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: { labels: { color: '#1A1226' } },
        },
        scales: {
          x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 60, color: '#1A1226' } },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks: { color: '#1A1226' } },
        },
      },
    });
  }

  // Min/max temperature: 4 datasets (max/min x history/forecast), dashed = history,
  // solid = forecast, thick line = max, thin line = min.
  function drawWeatherTempChart(canvas, chart) {
    const max = splitHistForecast(chart.max, chart.history_days);
    const min = splitHistForecast(chart.min, chart.history_days);
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: chart.labels.map(shortDate),
        datasets: [
          { label: 'Max — History', data: max.hist, borderColor: HIST_COLOR, backgroundColor: HIST_COLOR, borderDash: [6,4], borderWidth: 2.5, pointRadius: 2, spanGaps: true, tension: 0.2 },
          { label: 'Max — Forecast', data: max.fcst, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 2.5, pointRadius: 2, spanGaps: true, tension: 0.2 },
          { label: 'Min — History', data: min.hist, borderColor: HIST_COLOR, backgroundColor: HIST_COLOR, borderDash: [6,4], borderWidth: 1.25, pointRadius: 2, spanGaps: true, tension: 0.2 },
          { label: 'Min — Forecast', data: min.fcst, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 1.25, pointRadius: 2, spanGaps: true, tension: 0.2 },
        ],
      },
      plugins: [histForecastBgPlugin(chart.history_days)],
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: { labels: { color: '#1A1226' } },
        },
        scales: {
          x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 60, color: '#1A1226' } },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks: { color: '#1A1226' } },
        },
      },
    });
  }

  // Soil moisture at two depths: 4 datasets (shallow/deep x history/forecast), same
  // dashed-history/solid-forecast convention as temperature, thick line = shallow (3-9cm),
  // thin line = deep (27-81cm).
  function drawSoilMoistureChart(canvas, chart) {
    const shallow = splitHistForecast(chart.shallow, chart.history_days);
    const deep = splitHistForecast(chart.deep, chart.history_days);
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: chart.labels.map(shortDate),
        datasets: [
          { label: 'Shallow (3-9cm) — History', data: shallow.hist, borderColor: HIST_COLOR, backgroundColor: HIST_COLOR, borderDash: [6,4], borderWidth: 2.5, pointRadius: 2, spanGaps: true, tension: 0.2 },
          { label: 'Shallow (3-9cm) — Forecast', data: shallow.fcst, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 2.5, pointRadius: 2, spanGaps: true, tension: 0.2 },
          { label: 'Deep (27-81cm) — History', data: deep.hist, borderColor: HIST_COLOR, backgroundColor: HIST_COLOR, borderDash: [6,4], borderWidth: 1.25, pointRadius: 2, spanGaps: true, tension: 0.2 },
          { label: 'Deep (27-81cm) — Forecast', data: deep.fcst, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 1.25, pointRadius: 2, spanGaps: true, tension: 0.2 },
        ],
      },
      plugins: [histForecastBgPlugin(chart.history_days)],
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: { labels: { color: '#1A1226' } },
        },
        scales: {
          x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 60, color: '#1A1226' } },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks: { color: '#1A1226' } },
        },
      },
    });
  }

  // Daily streamflow discharge: a single plain line, same style as the generic fallback
  // but with a title and short-form date labels to match the other domain charts.
  function drawStreamflowDischargeChart(canvas, chart) {
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: chart.labels.map(shortDate),
        datasets: [{
          label: chart.y_label,
          data: chart.values,
          borderColor: '#0FB5A6',
          backgroundColor: 'rgba(15,181,166,0.12)',
          fill: true,
          pointRadius: 2,
          spanGaps: true,
          tension: 0.25,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: { display: false },
        },
        scales: {
          x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 60, color: '#1A1226' } },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks: { color: '#1A1226' } },
        },
      },
    });
  }

  // Gauge height and water temperature on independent axes (feet vs. degC don't share
  // a scale). Not every gauge reports both -- only the fields the tool actually
  // returned get a dataset and an axis.
  function drawRiverLevelTempChart(canvas, chart) {
    const datasets = [];
    const scales = { x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 60, color: '#1A1226' } } };
    if (chart.gauge_height) {
      datasets.push({ label: 'Gauge Height (ft)', data: chart.gauge_height, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 2.5, pointRadius: 2, spanGaps: true, tension: 0.2, yAxisID: 'y' });
      scales.y = { position: 'left', title: { display: true, text: 'Gauge Height (ft)', color: '#1A1226' }, ticks: { color: '#1A1226' } };
    }
    if (chart.water_temp) {
      const tempAxis = chart.gauge_height ? 'y1' : 'y';
      datasets.push({ label: 'Water Temp (°C)', data: chart.water_temp, borderColor: '#FF9A5A', backgroundColor: '#FF9A5A', borderWidth: 2.5, pointRadius: 2, spanGaps: true, tension: 0.2, yAxisID: tempAxis });
      scales[tempAxis] = {
        position: chart.gauge_height ? 'right' : 'left',
        grid: chart.gauge_height ? { drawOnChartArea: false } : undefined,
        title: { display: true, text: 'Water Temp (°C)', color: '#1A1226' },
        ticks: { color: '#1A1226' },
      };
    }
    new Chart(canvas, {
      type: 'line',
      data: { labels: chart.labels.map(shortDate), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: { labels: { color: '#1A1226' } },
        },
        scales,
      },
    });
  }

  // Annual climate-outlook chart (temp or precip): a shaded cross-model range band plus
  // an ensemble-mean line split at the current year -- dashed red = simulated historical,
  // solid blue = projected. The "range" band is the standard two-dataset trick: an
  // invisible min line, then a max line filled back to it (fill:'-1').
  function drawClimateAnnualChart(canvas, chart) {
    const mean = splitAtBoundary(chart.mean, chart.years, chart.boundary_year);
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: chart.years,
        datasets: [
          { label: 'Model range', hideFromLegend: true, data: chart.range_min, borderWidth: 0, pointRadius: 0, fill: false },
          { label: 'Model range', pointStyle: 'rect', data: chart.range_max, borderWidth: 0, pointRadius: 0, fill: '-1', backgroundColor: 'rgba(24,95,165,0.12)' },
          { label: 'Ensemble mean — simulated historical', pointStyle: 'line', data: mean.hist, borderColor: HIST_COLOR, backgroundColor: HIST_COLOR, borderDash: [6,4], borderWidth: 2, pointRadius: 0, spanGaps: true, tension: 0.2 },
          { label: 'Ensemble mean — projected', pointStyle: 'line', data: mean.fcst, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 2, pointRadius: 0, spanGaps: true, tension: 0.2 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: POINT_STYLE_LEGEND,
        },
        scales: {
          x: { ticks: { color: '#1A1226', maxTicksLimit: 12 } },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks: { color: '#1A1226' } },
        },
      },
    });
  }

  // Monthly climatology comparison (temp or precip): historical (1970-2010, red) vs.
  // future (2026-2050, blue) window, each with its own shaded variation-range band plus
  // a mean line -- both fixed periods, not a history/forecast split like the charts above.
  function drawClimatologyChart(canvas, chart) {
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: chart.labels,
        datasets: [
          { label: `Historical variation range (${chart.hist_label})`, hideFromLegend: true, data: chart.hist_min, borderWidth: 0, pointRadius: 0, fill: false },
          { label: `Historical variation range (${chart.hist_label})`, pointStyle: 'rect', data: chart.hist_max, borderWidth: 0, pointRadius: 0, fill: '-1', backgroundColor: 'rgba(163,45,45,0.15)' },
          { label: `Future variation range (${chart.fut_label})`, hideFromLegend: true, data: chart.fut_min, borderWidth: 0, pointRadius: 0, fill: false },
          { label: `Future variation range (${chart.fut_label})`, pointStyle: 'rect', data: chart.fut_max, borderWidth: 0, pointRadius: 0, fill: '-1', backgroundColor: 'rgba(24,95,165,0.15)' },
          { label: `Historical (${chart.hist_label})`, pointStyle: 'line', data: chart.hist_mean, borderColor: HIST_COLOR, backgroundColor: HIST_COLOR, borderWidth: 2.5, pointRadius: 3, spanGaps: true, tension: 0.3 },
          { label: `Future (${chart.fut_label})`, pointStyle: 'line', data: chart.fut_mean, borderColor: FCST_COLOR, backgroundColor: FCST_COLOR, borderWidth: 2.5, pointRadius: 3, spanGaps: true, tension: 0.3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: chart.title, color: '#1A1226', font: { size: 12, weight: '700' } },
          legend: POINT_STYLE_LEGEND,
        },
        scales: {
          x: { ticks: { color: '#1A1226' } },
          y: { title: { display: true, text: chart.y_label, color: '#1A1226' }, ticks: { color: '#1A1226' } },
        },
      },
    });
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>
</body>
</html>
